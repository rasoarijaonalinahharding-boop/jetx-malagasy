<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetX Malagasy</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tesseract.js ho an'ny AI Dépôt Scan -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>JetX Malagasy</h2>
        
        <!-- Fisoratana Anarana -->
        <div id="auth-section">
            <h3>Fisoratana Anarana</h3>
            <input type="text" id="username" placeholder="Anarana / Pseudo">
            <input type="text" id="phone" placeholder="Laharana finday (Ohatra: 0387680298)">
            <input type="number" id="age" placeholder="Taona (Tokony ho >= 18)">
            <button onclick="login()">HIDITRA AMIN'NY LALAO</button>
        </div>

        <!-- Sehatry ny Lalao -->
        <div id="game-section" style="display:none;">
            <p>Mpilalao: <span id="player-display" style="color: #f1c40f; font-weight: bold;"></span></p>
            <p>Solde: <span id="solde-display" style="color: #2ecc71; font-weight: bold;">5000000</span> Ar</p>
            <button onclick="logout()" style="background:#e74c3c; padding: 6px; width: auto; font-size: 12px;">Déconnexion</button>
            
            <!-- Bokotra Dépôt (AI) sy Retrait -->
            <div style="display: flex; gap: 10px; margin: 10px 0;">
                <button onclick="openDepot()" style="background: #27ae60; font-size: 13px;">⚡ DÉPÔT (AI)</button>
                <button onclick="openRetrait()" style="background: #c0392b; font-size: 13px;">💸 RETRAIT</button>
            </div>

            <!-- Fizarana Dépôt AI -->
            <div id="depot-modal" style="background: #1f293d; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none;">
                <p style="font-size: 13px; margin: 0 0 5px 0;">Safidio ny sary reçabu (50 Ar - 10 000 Ar):</p>
                <input type="file" id="receipt-file" accept="image/*" style="font-size: 12px; padding: 4px;">
                <button onclick="processDepotAI()" style="background: #3498db; font-size: 12px; padding: 6px;">AI: VAKIO NY REÇU</button>
                <p id="ai-status" style="font-size: 12px; color: #f1c40f; margin: 5px 0 0 0;"></p>
            </div>

            <!-- Tabilao tantaran'ny lalao -->
            <div class="history-bar" id="history-bar">
                <div class="history-item">3.03x</div>
                <div class="history-item">1.5x</div>
                <div class="history-item">2.1x</div>
            </div>

            <!-- Efijery fahitana ilay lalao -->
            <div class="game-screen" style="position: relative; background: linear-gradient(135deg, #111827, #1f293d);">
                <div class="rope" style="position: absolute; left: 50%; width: 3px; height: 100%; background: #374151;"></div>
                <div id="climber" style="position: absolute; bottom: 20px; left: calc(50% - 16px); font-size: 32px; transition: bottom 0.1s linear; filter: drop-shadow(0 0 5px #3498db);">🚀🧗‍♂️</div>
                <h1 id="multiplier" style="color: #38bdf8; font-size: 36px; position: absolute; z-index: 2; margin: 0; top: 10px; left: 15px;">1.00x</h1>
            </div>

            <p id="gain-display" style="color: #f39c12; font-weight: bold; min-height: 20px; margin: 5px 0;">Gain: 0 Ar</p>
            <p id="status-message" style="color: #f39c12; font-weight: bold; min-height: 20px;"></p>

            <!-- Toerana fanaovana Mise sy Tapaka Auto (Cash Out) -->
            <div style="background: #1f293d; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
                <input type="number" id="mise" placeholder="Mise (Ar)" style="margin-bottom: 5px;">
                <input type="number" id="auto-cashout" placeholder="Tapaka Auto x (Ohatra: 2.0)" step="0.1" style="margin-bottom: 5px;">
                <button id="btn-cashout" onclick="playerCashOut()" style="background: #27ae60; font-size: 15px; font-weight: bold;" disabled>RAISO NY VOLA (CASH OUT)</button>
            </div>

            <button onclick="openAdmin()" style="background: #9b59b6; margin-top: 5px;">👑 OKOFA ADMIN PANEL (0387680298)</button>

            <!-- Chat & AI Assistant -->
            <h3>Chat Public & AI Assistant</h3>
            <div class="chat-box" id="chat-box">
                <div>🤖 <b>AI ASSISTANT:</b> Tonga soa! Dépôt 50-10000 Ar. Laharana Admin: 0387680298</div>
            </div>
        </div>
    </div>

    <!-- JavaScript Feno -->
    <script>
        let audioCtx = null;
        function playSound(freq, type, duration) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        let gameInProgress = false;
        let playerInGame = false;
        let currentMise = 0;
        let currentMultiplier = 1.00;
        let autoCashOutVal = 0;

        function login() {
            const name = document.getElementById('username').value;
            const phone = document.getElementById('phone').value;
            const age = document.getElementById('age').value;

            if(!name || !phone || !age) {
                alert("Fenoy avokoa ny banga rehetra!");
                return;
            }
            if(parseInt(age) < 18) {
                alert("Tsy maintsy feno 18 taona vao afaka milalao!");
                return;
            }

            document.getElementById('player-display').innerText = name + (phone === "0387680298" ? " (Admin)" : "");
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('game-section').style.display = 'block';
            playSound(600, 'sine', 0.2);

            startAutoGame();
        }

        function logout() {
            document.getElementById('auth-section').style.display = 'block';
            document.getElementById('game-section').style.display = 'none';
        }

        function openAdmin() {
            alert("Admin Hotline / Laharana: 0387680298. Vonona hanampy anao izahay.");
        }

        function openDepot() {
            let dm = document.getElementById('depot-modal');
            dm.style.display = dm.style.display === 'none' ? 'block' : 'none';
        }

        async function processDepotAI() {
            let fileInput = document.getElementById('receipt-file');
            let statusEl = document.getElementById('ai-status');
            if(fileInput.files.length === 0) {
                alert("Mifidiana sary reçabu aloha!");
                return;
            }
            statusEl.innerText = "⏳ AI mamaky ny sary...";
            try {
                let result = await Tesseract.recognize(fileInput.files[0], 'eng');
                let text = result.data.text;
                statusEl.innerText = "Voavaky ny AI! Manamarina...";
                
                let numbers = text.match(/\d+/g);
                let detectedAmount = 1000;
                if(numbers) {
                    for(let n of numbers) {
                        let val = parseInt(n);
                        if(val >= 50 && val <= 10000) {
                            detectedAmount = val;
                            break;
                        }
                    }
                }

                if(detectedAmount >= 50 && detectedAmount <= 10000) {
                    let soldeEl = document.getElementById('solde-display');
                    let currentSolde = parseFloat(soldeEl.innerText);
                    currentSolde += detectedAmount;
                    soldeEl.innerText = currentSolde;
                    alert("✅ Dépôt voamarina tamin'ny alalan'ny AI: +" + detectedAmount + " Ar");
                    document.getElementById('depot-modal').style.display = 'none';
                } else {
                    alert("❌ Tsy nahita vola teo anelanelan'ny 50-10000 Ar tao amin'ny sary ny AI.");
                }
                statusEl.innerText = "";
            } catch(err) {
                statusEl.innerText = "Nisy olona tamin'ny famakiana AI.";
            }
        }

        function openRetrait() {
            let amountStr = prompt("Ampidiro ny vola tianao kalsina (Retrait):");
            if(!amountStr) return;
            let amount = parseFloat(amountStr);
            let soldeEl = document.getElementById('solde-display');
            let currentSolde = parseFloat(soldeEl.innerText);

            if(isNaN(amount) || amount <= 0) {
                alert("Diso ny vola nampidirinao!");
                return;
            }
            if(amount > currentSolde) {
                alert("Tsy ampy ny solde anananao hanaovana io retrait io!");
                return;
            }

            currentSolde -= amount;
            soldeEl.innerText = currentSolde;
            alert("💸 Retrait mitentina " + amount + " Ar natao soa aman-tsara!");
        }

        // Fanaovana Cash Out (Mandray vola alohan'ny hianjerana)
        function playerCashOut() {
            if(!playerInGame) return;
            let winAmount = Math.floor(currentMise * currentMultiplier);
            let soldeEl = document.getElementById('solde-display');
            let currentSolde = parseFloat(soldeEl.innerText);
            
            currentSolde += winAmount;
            soldeEl.innerText = currentSolde;

            document.getElementById('status-message').innerText = "🎉 Nandresy " + winAmount + " Ar (tamin'ny " + currentMultiplier.toFixed(2) + "x)!";
            playSound(800, 'sine', 0.3);
            
            playerInGame = false;
            document.getElementById('btn-cashout').disabled = true;
        }

        // Fihodinana lalao mandeha ho azy (Automatic Game Loop)
        function startAutoGame() {
            setInterval(() => {
                if(gameInProgress) return;
                
                // Raisina ny mise sy tapaka auto raha misy napetraky ny mpilalao
                let miseInput = parseFloat(document.getElementById('mise').value) || 0;
                let autoInput = parseFloat(document.getElementById('auto-cashout').value) || 0;
                let soldeEl = document.getElementById('solde-display');
                let currentSolde = parseFloat(soldeEl.innerText);

                if(miseInput > 0 && miseInput <= currentSolde) {
                    currentSolde -= miseInput;
                    soldeEl.innerText = currentSolde;
                    currentMise = miseInput;
                    playerInGame = true;
                    autoCashOutVal = autoInput;
                    document.getElementById('btn-cashout').disabled = false;
                } else {
                    playerInGame = false;
                    currentMise = 0;
                    document.getElementById('btn-cashout').disabled = true;
                }

                gameInProgress = true;
                currentMultiplier = 1.00;
                let climber = document.getElementById('climber');
                let crashAt = (Math.random() * 3 + 1.5).toFixed(2);
                document.getElementById('status-message').innerText = "🚀 Mandeha ny lalao...";

                let interval = setInterval(() => {
                    currentMultiplier += 0.04;
                    document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
                    
                    let bottomPos = Math.min(140, (currentMultiplier - 1) * 35);
                    climber.style.bottom = bottomPos + 'px';

                    if(playerInGame) {
                        let tempGain = Math.floor(currentMise * currentMultiplier);
                        document.getElementById('gain-display').innerText = "Gain: " + tempGain + " Ar";
                        
                        // Fijerena an'ilay Tapaka Auto (Auto Cash Out)
                        if(autoCashOutVal > 0 && currentMultiplier >= autoCashOutVal) {
                            playerCashOut();
                        }
                    } else {
                        document.getElementById('gain-display').innerText = "Gain: 0 Ar";
                    }

                    playSound(300 + currentMultiplier * 50, 'triangle', 0.05);

                    if(currentMultiplier >= crashAt) {
                        clearInterval(interval);
                        playSound(150, 'sawtooth', 0.4);
                        
                        if(playerInGame) {
                            document.getElementById('status-message').innerText = "💥 Nianjera ny lalao (Crash at " + crashAt + "x)! Very ny mise!";
                            playerInGame = false;
                            document.getElementById('btn-cashout').disabled = true;
                        } else {
                            document.getElementById('status-message').innerText = "💥 Nianjera ny lalao (Crash at " + crashAt + "x)!";
                        }
                        
                        document.getElementById('gain-display').innerText = "Gain: 0 Ar";
                        climber.style.bottom = "20px";
                        
                        let historyBar = document.getElementById('history-bar');
                        let newItem = document.createElement('div');
                        newItem.className = 'history-item';
                        newItem.innerText = crashAt + 'x';
                        historyBar.prepend(newItem);

                        gameInProgress = false;
                    }
                }, 100);
            }, 4000);
        }
    </script>
</body>
</html>
